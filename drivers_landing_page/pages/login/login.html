<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | E-Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="../../static/css/feedback.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="../../index.html">E-Parking</a>
  <div class="links"><a href="../../index.html">Início</a><a id="registerLink" href="../register/register.html">Criar conta</a></div>
</header>
<main class="wrap">
  <div class="auth">
    <section class="info">
      <div>ÁREA DO MOTORISTA</div>
      <h1>Entrar no <span>E-Parking</span></h1>
      <p>Acesse sua conta para pesquisar estacionamentos, realizar reservas e acompanhar seus pagamentos.</p>
    </section>
    <section class="form">
      <h2>Entrar</h2>
      <p id="formMessage" class="form-message" hidden></p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="email">E-mail</label><input type="email" id="email" autocomplete="email" placeholder="seuemail@email.com"></div>
        <div class="field"><label for="password">Senha</label><input type="password" id="password" autocomplete="current-password" placeholder="Digite sua senha"></div>
        <button class="btn" type="submit">Entrar no E-Parking</button>
      </form>
      <p class="small">Ainda não possui uma conta? <a id="registerLinkBottom" href="../register/register.html">Criar cadastro</a></p>
    </section>
  </div>
</main>
<script src="../../static/js/storage.js"></script>
<script src="../../static/js/validation.js"></script>
<script src="login.js"></script>
</body>
</html>
