<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cadastro | E-Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="register.css">
<link rel="stylesheet" href="../../static/css/feedback.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="../../index.html">E-Parking</a>
  <div class="links"><a href="../../index.html">Início</a><a id="loginLink" href="../login/login.html">Entrar</a></div>
</header>
<main class="wrap">
  <div class="auth">
    <section class="info">
      <div>CADASTRO DO MOTORISTA</div>
      <h1>Crie sua <span>conta</span></h1>
      <p>Cadastre-se no E-Parking para encontrar estacionamentos, reservar vagas e acompanhar suas reservas.</p>
    </section>
    <section class="form">
      <h2>Criar conta</h2>
      <form id="registerForm" novalidate>
        <div class="field"><label for="fullName">Nome completo</label><input id="fullName" autocomplete="name" placeholder="Seu nome e sobrenome"></div>
        <div class="field"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" placeholder="000.000.000-00"></div>
        <div class="field"><label for="email">E-mail</label><input type="email" id="email" autocomplete="email" placeholder="seuemail@email.com"></div>
        <div class="field"><label for="password">Senha</label><input type="password" id="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"></div>
        <div class="field"><label for="confirmPassword">Confirmar senha</label><input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Digite a senha novamente"></div>
        <button class="btn" type="submit">Criar minha conta</button>
      </form>
      <p class="small">Já possui uma conta? <a id="loginLinkBottom" href="../login/login.html">Entrar</a></p>
    </section>
  </div>
</main>
<script src="../../static/js/storage.js"></script>
<script src="../../static/js/validation.js"></script>
<script src="register.js"></script>
</body>
</html>
