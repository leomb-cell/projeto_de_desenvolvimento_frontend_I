<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vagas disponíveis | E-Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="results.css">
<link rel="stylesheet" href="../../static/css/feedback.css">
</head>
<body>
<section class="top">
  <header class="nav">
    <a class="brand" href="../../index.html">E-Parking</a>
    <nav class="navlinks" id="sessionLinks"><a href="../../index.html">Início</a><a href="../login/login.html">Entrar</a></nav>
  </header>
  <div class="container hero">
    <a class="back" href="../../index.html#buscar">← Voltar para início</a>
    <h1>Vagas disponíveis</h1>
    <p>Encontre o estacionamento ideal para sua viagem.</p>
    <div class="searchbar"><b>⌕ &nbsp; Busca realizada:</b> <span id="searchText">Centro, Florianópolis</span></div>
  </div>
</section>

<main class="main">
  <div class="container">
    <div class="main-head">
      <h2>Estacionamentos encontrados</h2>
      <span id="resultCount">0 opções encontradas</span>
    </div>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filtrar estacionamentos">
        <button type="button" class="filter" data-feature="Coberto" aria-pressed="false">Coberto</button>
        <button type="button" class="filter" data-feature="24 horas" aria-pressed="false">24 horas</button>
        <button type="button" class="filter" data-feature="Acessível" aria-pressed="false">Acessível</button>
      </div>
      <label class="sort">Ordenar por
        <select id="sortSelect">
          <option value="rating">Melhor avaliação</option>
          <option value="price">Menor preço</option>
          <option value="spots">Mais vagas</option>
        </select>
      </label>
    </div>

    <div class="list" id="parkingList"></div>
    <p class="empty" id="emptyMessage" hidden>Nenhum estacionamento atende a esses filtros. Tente remover algum filtro.</p>
  </div>
</main>

<template id="parkingCardTemplate">
  <article class="card">
    <div>
      <h3 class="parking-name"></h3>
      <p class="parking-address"></p>
      <div class="chips"></div>
      <div class="rating"><b class="rating-value"></b> <span class="rating-label"></span></div>
    </div>
    <div class="price">
      <small>A partir de</small><br>
      <strong class="price-value"></strong><span>/hora</span><br>
      <a class="btn">Ver estacionamento</a>
    </div>
  </article>
</template>

<script src="../../static/js/storage.js"></script>
<script src="../../static/js/parkings.js"></script>
<script src="results.js"></script>
</body>
</html>
