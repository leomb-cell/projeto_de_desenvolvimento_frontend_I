<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- css -->
    <link rel="stylesheet" href="../../static/css/register.css" />
    <link rel="stylesheet" href="../../static/css/navbar.css" />
    <link rel="stylesheet" href="../../static/css/responsivity.css" />
    <link rel="stylesheet" href="../../static/css/font.css" />
    <link rel="stylesheet" href="../../static/css/footer.css" />

    <link
      rel="shortcut icon"
      href="./static/images/icone.png"
      type="image/x-icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <title>E-Parking Florianópolis</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- navbar -->
      <custom-navbar
        logo="../../static/images/icone_e_parking.png"
        cssSrc="../../static/css/navbar.css"
        base="../../"
        active="sobre"
      ></custom-navbar>
    </header>

    <!-- Conteudo principal -->

    <main id="main_container" class="form-signin w-50 mt-5 m-auto">
      <form>
        <!-- Ícone -->
        <img
          class="mb-4 d-block mx-auto"
          src="../../static/images/login_logo.png"
          alt="Ícone de cadastro"
          width="72"
        />

        <!-- Título -->
        <h1 class="h3 mb-4 fw-normal text-center">Crie sua conta</h1>

        <!-- Nome -->
        <div class="form-floating mb-2 input-container">
          <input
            type="text"
            class="form-control"
            id="floatingNome"
            placeholder="Nome completo"
          />
          <label for="floatingNome">Nome completo</label>
        </div>

        <!-- E-mail -->
        <div class="form-floating mb-2 input-container">
          <input
            type="email"
            class="form-control"
            id="floatingEmail"
            placeholder="name@example.com"
          />
          <label for="floatingEmail">E-Mail</label>
        </div>

        <!-- CPF ou CNPJ -->
        <div class="form-floating mb-2 input-container">
          <input
            type="text"
            class="form-control"
            id="floatingCPF"
            placeholder="000.000.000-00"
          />
          <label for="floatingCPF">CPF</label>
        </div>

        <!-- Senha -->
        <div class="form-floating mb-2 input-container">
          <input
            type="password"
            class="form-control"
            id="floatingSenha"
            placeholder="Senha"
          />
          <label for="floatingSenha">Senha</label>
        </div>

        <!-- Confirmar senha -->
        <div class="form-floating mb-3 input-container">
          <input
            type="password"
            class="form-control"
            id="floatingConfirmarSenha"
            placeholder="Confirmar senha"
          />
          <label for="floatingConfirmarSenha">Confirmar senha</label>
        </div>

        <!-- Termos -->
        <div class="form-check my-3 input-container">
          <input class="form-check-input" type="checkbox" id="termos" />

          <label class="form-check-label" for="termos">
            Aceito os termos de uso
          </label>
        </div>

        <!-- Botão -->
        <button id="btn_cadastrar" class="btn d-block mx-auto" type="submit">
          Cadastrar
        </button>
      </form>
    </main>

    <!-- footer -->

    <custom-footer
      logo="../../static/images/icone_e_parking.png"
      cssSrc="static/css/footer.css"
      base="../../"
    ></custom-footer>

    <!-- scripts -->

    <script src="../../static/components/footer.js"></script>

    <script src="../../static/components/navbar.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
