<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- css -->
    <link rel="stylesheet" href="..\..\static\css\login.css" />
    <link rel="stylesheet" href="../../static/css/navbar.css" />
    <link rel="stylesheet" href="../../static/css/responsivity.css" />
    <link rel="stylesheet" href="../../static/css/font.css" />
    <link rel="stylesheet" href="../../static/css/footer.css" />

    <link
      rel="shortcut icon"
      href="./static/images/icone.png"
      type="image/x-icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <title>E-Parking Florianópolis</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- navbar -->
      <custom-navbar
        logo="../../static/images/icone_e_parking.png"
        cssSrc="../../static/css/navbar.css"
        base="../../"
        active="sobre"
      ></custom-navbar>
    </header>

    <!-- Conteudo principal -->

    <main id="main_container" class="form-signin w-50 mt-5 m-auto">
      <form>
        <img
          class="mb-4 d-block mx-auto"
          src="../../static/images/login_logo.png"
          alt="Login Icone"
          width="72"
        />

        <h1 class="h3 mb-3 fw-normal text-center">
          Insira seus dados de login
        </h1>

        <div class="form-floating mb-2 input-container">
          <input
            type="email"
            class="form-control"
            id="floatingInput"
            placeholder="name@example.com"
          />
          <label for="floatingInput">E-mail</label>
        </div>

        <div class="form-floating mb-2 input-container">
          <input
            type="password"
            class="form-control"
            id="floatingPassword"
            placeholder="Password"
          />
          <label for="floatingPassword">Senha</label>
        </div>

        <div class="form-check my-3 input-container">
          <input class="form-check-input" type="checkbox" id="checkDefault" />

          <label class="form-check-label" for="checkDefault">
            Lembrar de mim
          </label>
        </div>

        <button id="btn_entrar" class="btn d-block mx-auto" type="submit">
          Entrar
        </button>
      </form>
    </main>

    <!-- footer -->

    <custom-footer
      logo="../../static/images/icone_e_parking.png"
      cssSrc="static/css/footer.css"
      base="../../"
    ></custom-footer>

    <!-- scripts -->

    <script src="../../static/components/footer.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="../../static/components/navbar.js"></script>
  </body>
</html>
