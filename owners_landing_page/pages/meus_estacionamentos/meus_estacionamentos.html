<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- css -->
    <link rel="stylesheet" href="..\..\static\css\login.css" />
    <link rel="stylesheet" href="../../static/css/navbar.css" />
    <link rel="stylesheet" href="../../static/css/responsivity.css">
    <link rel="stylesheet" href="../../static/css/font.css">

    <link
      rel="shortcut icon"
      href="./static/images/icone.png"
      type="image/x-icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <title>E-Parking Florianópolis</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- navbar -->
      <nav id="nav_bar" class="navbar navbar-expand-lg border-bottom border-body" class="navbar " data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="../../index.html">
            <img
              src="../../\static\images\icone_e_parking.png"
              alt="icone E-Parking"
              class="logo"
            />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link"
                  aria-current="page"
                  href="../../index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="../about_Us/about_Us.html"
                  >Sobre nós</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="./meus_estacionamentos.html"
                  >Meus estacionamentos</a
                >
              </li>
            </ul>
            <a id="login_btn" class="btn mx-2 " href="../login/login.html"
              >Login</a
            >
            <a id="register_btn" class="btn" href="../register/resgister.html"
              >Cadastrar</a
            >
          </div>
        </div>
      </nav>
    </header>

    <!-- Conteudo principal -->

    <main id="main_container">
      <!-- Parte do Cadastro -->

      <section id="cadastro" class="text-center">
        <h2>Cadastre seu estacionamento</h2>
        <div class="input-group mb-3 d-flex">
          <input
            type="text"
            class="form-control"
            placeholder="Nome"
            aria-label="nome"
            aria-describedby="basic-addon1"
          />
          <input
            type="text"
            class="form-control"
            placeholder="Sobrenome"
            aria-label="sobrenome"
            aria-describedby="basic-addon1"
          />
        </div>
        <div class="input-group mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="E-mail"
            aria-label="email"
          />
        </div>
        <button type="button" id="botao_cadastro" class="btn btn-primary">
          Cadastrar
        </button>
      </section>
    </main>

    <!-- footer -->

    <div class="container mt-5">
      <footer
        class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
      >
        <p id="flori_tm" class="col-md-4 mb-0 text-body-secondary">
          © 2026 E-Parking, Inc
        </p>
        <a
          href="/"
          class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
          aria-label="Bootstrap"
        >
          <img
            src="../../static/images/icone.png"
            id="logo_footer"
            class="logo"
            alt="logo"
          />
        </a>
        <ul id="footer_nav" class="nav col-md-4 justify-content-end">
          <li class="nav-item">
            <a href="../about_Us/about_Us.html" class="nav-link px-2 text-body-secondary"
              >Sobre nós</a
            >
          </li>
          <li class="nav-item">
            <a href="./meus_estacionamentos.html" class="nav-link px-2 text-body-secondary"
              >Meus estacionamentos</a
            >
          </li>
        </ul>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
