<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- css -->
    <link rel="stylesheet" href="../../static/css/meus_estacionamentos.css" />
    <link rel="stylesheet" href="../../static/css/navbar.css" />
    <link rel="stylesheet" href="../../static/css/responsivity.css" />
    <link rel="stylesheet" href="../../static/css/font.css" />
    <link rel="stylesheet" href="../../static/css/footer.css" />

    <link
      rel="shortcut icon"
      href="./static/images/icone.png"
      type="image/x-icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <title>E-Parking Florianópolis</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- navbar -->
      <custom-navbar
        logo="../../static/images/icone_e_parking.png"
        cssSrc="../../static/css/navbar.css"
        base="../../"
        active="sobre"
      ></custom-navbar>
    </header>

    <!-- Conteudo principal -->

    <main id="main_container">
      <button
        type="button"
        class="btn btn-add"
        data-bs-toggle="modal"
        data-bs-target="#exampleModal"
        data-bs-whatever="add"
      >
        Adicionar Estacionamento
      </button>

      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">
                Novo Estacionamento
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="formulario">
                <div class="mb-3">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Nome"
                    id="nome"
                  />
                </div>
                <div class="mb-3">
                  <textarea
                    class="form-control"
                    placeholder="Endereço"
                    id="endereco"
                  ></textarea>
                </div>
                <div class="mb-3">
                  <textarea
                    class="form-control"
                    placeholder="Total de Vagas"
                    id="totalVagas"
                  ></textarea>
                </div>
                <button type="submit" class="btn btn-confirmar">
                  Confirmar
                </button>
              </form>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-fechar"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
            </div>
          </div>
        </div>
      </div>

      <p></p>

      <table class="table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Nome</th>
            <th scope="col">Endereço</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </main>

    <!-- footer -->

    <custom-footer
      logo="../../static/images/icone_e_parking.png"
      cssSrc="static/css/footer.css"
      base="../../"
    ></custom-footer>

    <!-- Scripts -->

    <script src="../../static/components/navbar.js"></script>

    <script src="./meus_estacionamentos.js"></script>

    <script src="../../static/components/footer.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
